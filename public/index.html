<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Descarga magnets y reproduce tus videos desde una interfaz privada.">
  <title>Magnet Box</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23090c10'/%3E%3Cpath d='M18 16v19a14 14 0 0 0 28 0V16H36v19a4 4 0 0 1-8 0V16z' fill='none' stroke='%2367e8b6' stroke-width='7'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: dark; --bg:#090c10; --panel:#11161d; --panel2:#171d25; --line:#29313c; --text:#f5f7fa; --muted:#97a3b4; --accent:#67e8b6; --danger:#ff7b88; }
    * { box-sizing:border-box; }
    html,body { max-width:100%; overflow-x:hidden; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at 70% -20%,#16352e 0,transparent 34rem),var(--bg); color:var(--text); font:16px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif; }
    button,input { font:inherit; }
    button { cursor:pointer; }
    .shell { width:min(1180px,calc(100% - 32px)); min-width:0; margin:auto; padding:28px 0 64px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:34px; }
    .brand { display:flex; align-items:center; gap:12px; font-weight:800; letter-spacing:-.03em; font-size:1.25rem; }
    .mark { width:38px; height:38px; border:2px solid var(--accent); border-top-width:8px; border-radius:10px 10px 15px 15px; }
    h1,h2,p { margin-top:0; }
    h1 { font-size:clamp(2rem,6vw,3.8rem); line-height:.98; letter-spacing:-.06em; max-width:760px; margin-bottom:16px; }
    h2 { font-size:1rem; letter-spacing:.01em; margin:0; }
    .muted { color:var(--muted); }
    .ghost { border:1px solid var(--line); background:transparent; color:var(--muted); border-radius:10px; padding:9px 13px; }
    .ghost:hover { color:var(--text); border-color:#455161; }
    .add-box { margin:24px 0 34px; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; padding:9px; border:1px solid #33403f; background:rgba(17,22,29,.88); border-radius:16px; box-shadow:0 24px 80px rgba(0,0,0,.28); }
    .add-box input { width:100%; border:0; outline:0; background:transparent; color:var(--text); padding:13px 11px; min-width:0; }
    .add-box input::placeholder { color:#697587; }
    .primary { border:0; background:var(--accent); color:#07120e; padding:12px 20px; border-radius:10px; font-weight:800; }
    .primary:disabled { opacity:.55; cursor:wait; }
    .section-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; min-width:0; }
    .downloads-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr)); gap:14px; min-width:0; }
    .card { min-width:0; border:1px solid var(--line); background:rgba(17,22,29,.82); border-radius:17px; padding:18px; overflow:hidden; }
    .card-top { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; }
    .title { min-width:0; font-weight:750; overflow-wrap:anywhere; }
    .status { flex:0 0 auto; color:var(--accent); font-size:.78rem; text-transform:uppercase; letter-spacing:.09em; font-weight:800; }
    .status.bad { color:var(--danger); }
    .status.paused { color:#f7c76a; }
    .meta { color:var(--muted); font-size:.86rem; margin-top:6px; }
    .progress { height:6px; background:#222a34; border-radius:999px; overflow:hidden; margin:16px 0 9px; }
    .progress > div { height:100%; width:0; background:var(--accent); transition:width .35s ease; }
    .media-gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr)); gap:10px; margin-top:16px; min-width:0; }
    .media-card { position:relative; width:100%; min-width:0; aspect-ratio:16/9; padding:0; overflow:hidden; border:1px solid #33413f; border-radius:12px; background:linear-gradient(145deg,#1d2c29,#0b1015 68%); color:var(--text); text-align:left; isolation:isolate; touch-action:manipulation; }
    .media-card::before { content:'▶'; position:absolute; inset:0; z-index:-1; display:grid; place-items:center; color:rgba(103,232,182,.55); font-size:1.6rem; }
    .media-card:hover,.media-card:focus-visible,.media-card.previewing { border-color:#5ba98b; box-shadow:0 0 0 3px rgba(103,232,182,.1); }
    .media-thumb { position:absolute; inset:0; width:100%; height:100%; max-height:none; object-fit:cover; background:transparent; transition:transform .28s ease,filter .28s ease; pointer-events:none; }
    .media-card:hover .media-thumb,.media-card.previewing .media-thumb { transform:scale(1.035); }
    .media-shade { position:absolute; inset:0; display:flex; align-items:flex-end; padding:34px 10px 9px; background:linear-gradient(180deg,transparent 28%,rgba(3,6,8,.9)); pointer-events:none; }
    .media-name { width:100%; overflow:hidden; color:#fff; font-size:.82rem; font-weight:750; line-height:1.25; text-overflow:ellipsis; white-space:nowrap; }
    .media-play { position:absolute; top:9px; left:9px; display:grid; place-items:center; width:31px; height:31px; border-radius:999px; background:rgba(5,10,12,.74); color:var(--accent); font-size:.8rem; backdrop-filter:blur(6px); pointer-events:none; }
    .gallery-more { grid-column:1/-1; width:100%; border:1px dashed #3a4856; background:#121922; color:#cbd4df; padding:10px 13px; border-radius:10px; font-weight:700; }
    .gallery-more:hover { border-color:#607082; color:#fff; }
    .torrent-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:15px; padding-top:14px; border-top:1px solid var(--line); }
    .control { border:1px solid #3b4654; background:#1a222c; color:var(--text); padding:8px 13px; border-radius:9px; font-weight:700; }
    .control:hover { border-color:#647286; }
    .control.danger { color:#ffb4bc; border-color:#633943; background:#28161b; }
    .library { margin-top:38px; }
    .empty { padding:32px 18px; border:1px dashed var(--line); border-radius:15px; text-align:center; color:var(--muted); }
    .library-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr)); gap:13px; min-width:0; }
    .login { position:fixed; inset:0; z-index:20; display:grid; place-items:center; padding:20px; background:radial-gradient(circle at 50% 10%,#18372f,var(--bg) 55%); }
    .login.hidden,.app.hidden { display:none; }
    .login-card { width:min(410px,100%); border:1px solid #32433e; background:var(--panel); border-radius:20px; padding:28px; box-shadow:0 30px 90px rgba(0,0,0,.45); }
    .login-card .brand { margin-bottom:34px; }
    label { display:block; color:var(--muted); font-size:.88rem; margin:15px 0 6px; }
    .field { width:100%; border:1px solid var(--line); background:#0c1117; color:var(--text); border-radius:10px; padding:12px; outline:0; }
    .field:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(103,232,182,.1); }
    .login .primary { width:100%; margin-top:20px; }
    .message { min-height:24px; color:var(--danger); font-size:.88rem; margin:10px 0 0; }
    dialog { width:min(900px,calc(100% - 24px)); border:1px solid var(--line); border-radius:16px; padding:0; background:#050709; color:var(--text); box-shadow:0 30px 100px #000; }
    dialog::backdrop { background:rgba(0,0,0,.8); backdrop-filter:blur(5px); }
    .player-head { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 15px; }
    #player { width:100%; max-height:76vh; display:block; background:#000; }
    @media (max-width:640px) {
      .shell{width:calc(100% - 20px);padding:16px 0 44px}
      header{margin-bottom:24px}
      h1{font-size:2.35rem}
      .add-box{grid-template-columns:minmax(0,1fr);margin-bottom:28px}
      .add-box .primary{width:100%}
      .card{padding:14px;border-radius:14px}
      .card-top{display:block}
      .status{display:block;margin-top:8px}
      .media-gallery,.library-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
      .media-name{font-size:.76rem}
      .torrent-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
      .torrent-actions>:only-child{grid-column:1/-1}
      .control{min-width:0;padding:10px 8px;overflow:hidden;text-overflow:ellipsis}
      .login-card{padding:22px}
      .section-head>.muted{flex:0 0 auto}
    }
    @media (max-width:360px) { .media-gallery,.library-grid{grid-template-columns:minmax(0,1fr)} }
  </style>
</head>
<body>
  <section class="login" id="loginView">
    <form class="login-card" id="loginForm">
      <div class="brand"><span class="mark"></span> Magnet Box</div>
      <h2>Acceso privado</h2>
      <p class="muted">Ingresa tus credenciales para continuar.</p>
      <label for="username">Usuario</label>
      <input class="field" id="username" name="username" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <input class="field" id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">Entrar</button>
      <p class="message" id="loginMessage" role="alert"></p>
    </form>
  </section>

  <main class="app hidden" id="appView">
    <div class="shell">
      <header>
        <div class="brand"><span class="mark"></span> Magnet Box</div>
        <button class="ghost" id="logoutButton">Salir</button>
      </header>
      <h1>Un magnet.<br>Directo a tu pantalla.</h1>
      <p class="muted">Verifica lo que ya existe y descarga únicamente las piezas que faltan.</p>

      <form class="add-box" id="magnetForm">
        <input id="magnetInput" aria-label="Enlace magnet" placeholder="magnet:?xt=urn:btih:…" autocomplete="off" required>
        <button class="primary" type="submit">Agregar descarga</button>
      </form>
      <p class="message" id="addMessage" role="status"></p>

      <section>
        <div class="section-head"><h2>Descargas</h2><span class="muted" id="downloadCount">0 activas</span></div>
        <div class="downloads-grid" id="downloads"></div>
      </section>

      <section class="library">
        <div class="section-head"><h2>Videos en el servidor</h2><span class="muted" id="libraryCount">0 videos</span></div>
        <div class="library-grid" id="library"></div>
      </section>
    </div>
  </main>

  <dialog id="playerDialog">
    <div class="player-head"><strong id="playerTitle">Video</strong><button class="ghost" id="closePlayer">Cerrar</button></div>
    <video id="player" controls playsinline></video>
  </dialog>

  <script>
    const $ = (selector) => document.querySelector(selector)
    const loginView = $('#loginView')
    const appView = $('#appView')
    const playerDialog = $('#playerDialog')
    const player = $('#player')
    const expandedGalleries = new Set()
    let lastTorrentItems = []
    let torrentStructureKey = ''
    let libraryStructureKey = ''
    let libraryLimit = 18
    let lastLibraryItems = []
    let suppressPreviewClickUntil = 0
    let pressedPreviewCard = null
    let refreshTimer

    async function api(url, options = {}) {
      const response = await fetch(url, { ...options, headers: { 'Content-Type': 'application/json', ...(options.headers || {}) } })
      const data = response.headers.get('content-type')?.includes('json') ? await response.json() : null
      if (response.status === 401 && url !== '/api/login') showLogin()
      if (!response.ok) throw new Error(data?.error || 'No se pudo completar la acción.')
      return data
    }

    function humanBytes(value = 0) {
      const units = ['B','KB','MB','GB','TB']
      let size = value, unit = 0
      while (size >= 1024 && unit < units.length - 1) { size /= 1024; unit += 1 }
      return `${size.toFixed(unit ? 1 : 0)} ${units[unit]}`
    }

    function escapeHtml(value = '') {
      return value.replace(/[&<>'"]/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[char]))
    }

    function showLogin() {
      clearInterval(refreshTimer)
      appView.classList.add('hidden')
      loginView.classList.remove('hidden')
      player.pause()
      playerDialog.close?.()
    }

    function showApp() {
      loginView.classList.add('hidden')
      appView.classList.remove('hidden')
      refresh()
      clearInterval(refreshTimer)
      refreshTimer = setInterval(refresh, 2000)
    }

    function openPlayer(name, url) {
      $('#playerTitle').textContent = name
      player.src = url
      playerDialog.showModal()
      player.play().catch(() => {})
    }

    function mediaCard(item) {
      const name = escapeHtml(item.name)
      const url = escapeHtml(item.streamUrl)
      return `<button class="media-card" data-name="${name}" data-url="${url}" aria-label="Reproducir ${name}"><video class="media-thumb" muted playsinline preload="metadata" src="${url}#t=0.4"></video><span class="media-play">▶</span><span class="media-shade"><span class="media-name">${name}</span></span></button>`
    }

    function startPreview(card) {
      const video = card?.querySelector('.media-thumb')
      if (!video) return
      card.classList.add('previewing')
      video.muted = true
      video.play().catch(() => card.classList.remove('previewing'))
    }

    function stopPreview(card) {
      const video = card?.querySelector('.media-thumb')
      if (!video) return
      clearTimeout(card.previewTimer)
      video.pause()
      card.classList.remove('previewing')
    }

    function renderTorrents(items) {
      lastTorrentItems = items
      const active = items.filter((item) => !['completo','sin-seeders','error'].includes(item.status)).length
      $('#downloadCount').textContent = `${active} ${active === 1 ? 'activa' : 'activas'}`
      const nextStructureKey = JSON.stringify(items.map((item) => [item.id,item.name,item.status,item.message,item.files.map((file) => [file.name,file.video]),expandedGalleries.has(item.id)]))
      if (nextStructureKey === torrentStructureKey) {
        items.forEach((item) => {
          const card = document.getElementById(`torrent-${item.id}`)
          if (!card) return
          card.querySelector('.js-progress').style.width = `${Math.round(item.progress * 100)}%`
          card.querySelector('.js-stats').textContent = `${Math.round(item.progress * 100)}% · ${humanBytes(item.downloaded)} de ${humanBytes(item.length)} · ${humanBytes(item.speed)}/s`
          card.querySelector('.js-peers').textContent = `${item.peers} pares`
        })
        return
      }
      torrentStructureKey = nextStructureKey
      $('#downloads').innerHTML = items.length ? items.map((item) => {
        const percent = Math.round(item.progress * 100)
        const bad = ['sin-seeders','error'].includes(item.status)
        const paused = item.status === 'pausado'
        const videoFiles = item.files.filter((file) => file.video)
        const expanded = expandedGalleries.has(item.id)
        const visibleFiles = expanded ? videoFiles : videoFiles.slice(0,6)
        const cards = visibleFiles.map(mediaCard).join('')
        const toggle = videoFiles.length > 6 ? `<button class="gallery-more" data-gallery-id="${item.id}">${expanded ? 'Mostrar menos' : `Ver los ${videoFiles.length} videos`}</button>` : ''
        const files = cards ? `<div class="media-gallery">${cards}${toggle}</div>` : ''
        const pauseButton = item.status === 'descargando' ? `<button class="control" data-action="pause" data-id="${item.id}">Ⅱ Pausar</button>` : ''
        const resumeButton = paused ? `<button class="control" data-action="resume" data-id="${item.id}">▶ Reanudar</button>` : ''
        const cancelButton = item.status !== 'completo' ? `<button class="control danger" data-action="cancel" data-id="${item.id}">Cancelar</button>` : ''
        const actions = pauseButton || resumeButton || cancelButton ? `<div class="torrent-actions">${pauseButton}${resumeButton}${cancelButton}</div>` : ''
        return `<article class="card torrent-card" id="torrent-${item.id}"><div class="card-top"><div><div class="title">${escapeHtml(item.name)}</div><div class="meta">${escapeHtml(item.message)} · <span class="js-peers">${item.peers} pares</span></div></div><span class="status ${bad ? 'bad' : ''} ${paused ? 'paused' : ''}">${escapeHtml(item.status)}</span></div><div class="progress"><div class="js-progress" style="width:${percent}%"></div></div><div class="meta js-stats">${percent}% · ${humanBytes(item.downloaded)} de ${humanBytes(item.length)} · ${humanBytes(item.speed)}/s</div>${files}${actions}</article>`
      }).join('') : '<div class="empty">Aún no hay descargas. Pega tu primer magnet arriba.</div>'
    }

    function renderLibrary(items) {
      lastLibraryItems = items
      $('#libraryCount').textContent = `${items.length} ${items.length === 1 ? 'video' : 'videos'}`
      const nextStructureKey = JSON.stringify([libraryLimit,items.map((item) => [item.path,item.length])])
      if (nextStructureKey === libraryStructureKey) return
      libraryStructureKey = nextStructureKey
      if (!items.length) {
        $('#library').innerHTML = '<div class="empty">Los videos descargados aparecerán aquí.</div>'
        return
      }
      const visible = items.slice(0,libraryLimit).map(mediaCard).join('')
      const more = items.length > libraryLimit ? `<button class="gallery-more" data-library-more>Mostrar ${Math.min(18,items.length-libraryLimit)} más</button>` : ''
      $('#library').innerHTML = visible + more
    }

    async function refresh() {
      try {
        const [torrents, videos] = await Promise.all([api('/api/torrents'), api('/api/library')])
        renderTorrents(torrents)
        renderLibrary(videos)
      } catch (error) {
        if (!appView.classList.contains('hidden')) $('#addMessage').textContent = error.message
      }
    }

    $('#loginForm').addEventListener('submit', async (event) => {
      event.preventDefault()
      $('#loginMessage').textContent = ''
      try {
        await api('/api/login', { method:'POST', body:JSON.stringify({ username:$('#username').value, password:$('#password').value }) })
        event.target.reset()
        showApp()
      } catch (error) { $('#loginMessage').textContent = error.message }
    })

    $('#magnetForm').addEventListener('submit', async (event) => {
      event.preventDefault()
      const button = event.target.querySelector('button')
      button.disabled = true
      $('#addMessage').textContent = ''
      try {
        await api('/api/torrents', { method:'POST', body:JSON.stringify({ magnet:$('#magnetInput').value }) })
        event.target.reset()
        await refresh()
      } catch (error) { $('#addMessage').textContent = error.message }
      finally { button.disabled = false }
    })

    document.addEventListener('click', async (event) => {
      const galleryToggle = event.target.closest('[data-gallery-id]')
      if (galleryToggle) {
        const id = galleryToggle.dataset.galleryId
        if (expandedGalleries.has(id)) expandedGalleries.delete(id)
        else expandedGalleries.add(id)
        torrentStructureKey = ''
        renderTorrents(lastTorrentItems)
        return
      }

      if (event.target.closest('[data-library-more]')) {
        libraryLimit += 18
        libraryStructureKey = ''
        renderLibrary(lastLibraryItems)
        return
      }

      const button = event.target.closest('[data-url]')
      if (button) {
        if (Date.now() < suppressPreviewClickUntil) return
        return openPlayer(button.dataset.name, button.dataset.url)
      }

      const control = event.target.closest('[data-action]')
      if (!control) return
      const { action, id } = control.dataset
      if (action === 'cancel' && !confirm('¿Cancelar esta descarga y eliminar sus archivos parciales?')) return

      control.disabled = true
      $('#addMessage').textContent = ''
      try {
        playerDialog.close?.()
        const method = action === 'cancel' ? 'DELETE' : 'POST'
        const suffix = action === 'cancel' ? '' : `/${action}`
        await api(`/api/torrents/${id}${suffix}`, { method })
        await refresh()
      } catch (error) {
        $('#addMessage').textContent = error.message
        control.disabled = false
      }
    })
    document.addEventListener('pointerover', (event) => {
      const card = event.target.closest('.media-card')
      if (card && event.pointerType === 'mouse' && !card.contains(event.relatedTarget)) startPreview(card)
    })
    document.addEventListener('pointerout', (event) => {
      const card = event.target.closest('.media-card')
      if (card && event.pointerType === 'mouse' && !card.contains(event.relatedTarget)) stopPreview(card)
    })
    document.addEventListener('pointerdown', (event) => {
      const card = event.target.closest('.media-card')
      if (!card || event.pointerType === 'mouse') return
      pressedPreviewCard = card
      clearTimeout(card.previewTimer)
      card.previewTimer = setTimeout(() => {
        card.dataset.longPressed = 'true'
        startPreview(card)
      },450)
    })
    document.addEventListener('pointerup', (event) => {
      const card = event.target.closest('.media-card') || pressedPreviewCard
      if (!card) return
      clearTimeout(card.previewTimer)
      if (card.dataset.longPressed === 'true') {
        suppressPreviewClickUntil = Date.now() + 500
        delete card.dataset.longPressed
        stopPreview(card)
      }
      pressedPreviewCard = null
    })
    document.addEventListener('pointercancel', (event) => {
      const card = event.target.closest('.media-card') || pressedPreviewCard
      if (card) stopPreview(card)
      pressedPreviewCard = null
    })
    document.addEventListener('contextmenu', (event) => {
      if (event.target.closest('.media-card')) event.preventDefault()
    })
    $('#closePlayer').addEventListener('click', () => playerDialog.close())
    playerDialog.addEventListener('close', () => { player.pause(); player.removeAttribute('src'); player.load() })
    $('#logoutButton').addEventListener('click', async () => { await api('/api/logout', { method:'POST' }).catch(() => {}); showLogin() })

    api('/api/session').then((session) => session.authenticated ? showApp() : showLogin()).catch(showLogin)
  </script>
</body>
</html>
