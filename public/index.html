<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Descarga magnets y reproduce tus videos desde una interfaz privada.">
  <title>Magnet Box</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23090c10'/%3E%3Cpath d='M18 16v19a14 14 0 0 0 28 0V16H36v19a4 4 0 0 1-8 0V16z' fill='none' stroke='%2367e8b6' stroke-width='7'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: dark; --bg:#090c10; --panel:#11161d; --panel2:#171d25; --line:#29313c; --text:#f5f7fa; --muted:#97a3b4; --accent:#67e8b6; --danger:#ff7b88; }
    * { box-sizing:border-box; }
    html,body { max-width:100%; overflow-x:hidden; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at 70% -20%,#16352e 0,transparent 34rem),var(--bg); color:var(--text); font:16px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif; }
    button,input { font:inherit; }
    button { cursor:pointer; }
    .shell { width:min(1180px,calc(100% - 32px)); min-width:0; margin:auto; padding:28px 0 64px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:34px; }
    .brand { display:flex; align-items:center; gap:12px; font-weight:800; letter-spacing:-.03em; font-size:1.25rem; }
    .mark { width:38px; height:38px; border:2px solid var(--accent); border-top-width:8px; border-radius:10px 10px 15px 15px; }
    h1,h2,p { margin-top:0; }
    h1 { font-size:clamp(2rem,6vw,3.8rem); line-height:.98; letter-spacing:-.06em; max-width:760px; margin-bottom:16px; }
    h2 { font-size:1rem; letter-spacing:.01em; margin:0; }
    .muted { color:var(--muted); }
    .ghost { border:1px solid var(--line); background:transparent; color:var(--muted); border-radius:10px; padding:9px 13px; }
    .ghost:hover { color:var(--text); border-color:#455161; }
    .add-box { margin:24px 0 34px; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; padding:9px; border:1px solid #33403f; background:rgba(17,22,29,.88); border-radius:16px; box-shadow:0 24px 80px rgba(0,0,0,.28); }
    .add-box input { width:100%; border:0; outline:0; background:transparent; color:var(--text); padding:13px 11px; min-width:0; }
    .add-box input::placeholder { color:#697587; }
    .primary { border:0; background:var(--accent); color:#07120e; padding:12px 20px; border-radius:10px; font-weight:800; }
    .primary:disabled { opacity:.55; cursor:wait; }
    .section-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; min-width:0; }
    .downloads-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr)); gap:14px; min-width:0; }
    .card { min-width:0; border:1px solid var(--line); background:rgba(17,22,29,.82); border-radius:17px; padding:18px; overflow:hidden; }
    .card-top { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; }
    .title { min-width:0; font-weight:750; overflow-wrap:anywhere; }
    .status { flex:0 0 auto; color:var(--accent); font-size:.78rem; text-transform:uppercase; letter-spacing:.09em; font-weight:800; }
    .status.bad { color:var(--danger); }
    .status.paused { color:#f7c76a; }
    .meta { color:var(--muted); font-size:.86rem; margin-top:6px; }
    .progress { height:6px; background:#222a34; border-radius:999px; overflow:hidden; margin:16px 0 9px; }
    .progress > div { height:100%; width:0; background:var(--accent); transition:width .35s ease; }
    .media-gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr)); gap:10px; margin-top:16px; min-width:0; }
    .media-card { position:relative; width:100%; min-width:0; aspect-ratio:16/9; padding:0; overflow:hidden; border:1px solid #33413f; border-radius:12px; background:linear-gradient(145deg,#1d2c29,#0b1015 68%); color:var(--text); text-align:left; isolation:isolate; touch-action:manipulation; }
    .media-card::before { content:'▶'; position:absolute; inset:0; z-index:-1; display:grid; place-items:center; color:rgba(103,232,182,.55); font-size:1.6rem; }
    .media-card:hover,.media-card:focus-visible,.media-card.previewing { border-color:#5ba98b; box-shadow:0 0 0 3px rgba(103,232,182,.1); }
    .media-thumb { position:absolute; inset:0; width:100%; height:100%; max-height:none; object-fit:cover; background:transparent; opacity:0; transition:opacity .2s ease,transform .28s ease,filter .28s ease; pointer-events:none; }
    .media-card.thumb-ready .media-thumb,.media-card.previewing .media-thumb { opacity:1; }
    .media-card:hover .media-thumb,.media-card.previewing .media-thumb { transform:scale(1.035); }
    .media-shade { position:absolute; inset:0; display:flex; align-items:flex-end; padding:34px 10px 9px; background:linear-gradient(180deg,transparent 28%,rgba(3,6,8,.9)); pointer-events:none; }
    .media-name { width:100%; overflow:hidden; color:#fff; font-size:.82rem; font-weight:750; line-height:1.25; text-overflow:ellipsis; white-space:nowrap; }
    .media-play { position:absolute; top:9px; left:9px; display:grid; place-items:center; width:31px; height:31px; border-radius:999px; background:rgba(5,10,12,.74); color:var(--accent); font-size:.8rem; backdrop-filter:blur(6px); pointer-events:none; }
    .media-tools { position:absolute; z-index:5; top:8px; right:8px; display:flex; gap:6px; }
    .media-tool { display:grid; place-items:center; width:32px; height:32px; padding:0; border:1px solid rgba(255,255,255,.16); border-radius:999px; background:rgba(5,10,12,.82); color:#fff; backdrop-filter:blur(6px); }
    .media-tool.favorite { color:#ffd66b; }
    .media-tool.delete { color:#ff9da7; }
    .media-card.loading .media-play { animation:pulse 1s ease-in-out infinite alternate; }
    .media-file-progress { position:absolute; z-index:3; left:0; right:0; bottom:0; height:3px; background:#27313b; pointer-events:none; }
    .media-file-progress>span { display:block; height:100%; background:var(--accent); }
    .gallery-more { grid-column:1/-1; width:100%; border:1px dashed #3a4856; background:#121922; color:#cbd4df; padding:10px 13px; border-radius:10px; font-weight:700; }
    .gallery-more:hover { border-color:#607082; color:#fff; }
    .torrent-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:15px; padding-top:14px; border-top:1px solid var(--line); }
    .control { border:1px solid #3b4654; background:#1a222c; color:var(--text); padding:8px 13px; border-radius:9px; font-weight:700; }
    .control:hover { border-color:#647286; }
    .control.danger { color:#ffb4bc; border-color:#633943; background:#28161b; }
    .library { margin-top:38px; }
    .empty { padding:32px 18px; border:1px dashed var(--line); border-radius:15px; text-align:center; color:var(--muted); }
    .library-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr)); gap:13px; min-width:0; }
    .login { position:fixed; inset:0; z-index:20; display:grid; place-items:center; padding:20px; background:radial-gradient(circle at 50% 10%,#18372f,var(--bg) 55%); }
    .login.hidden,.app.hidden { display:none; }
    .login-card { width:min(410px,100%); border:1px solid #32433e; background:var(--panel); border-radius:20px; padding:28px; box-shadow:0 30px 90px rgba(0,0,0,.45); }
    .login-card .brand { margin-bottom:34px; }
    label { display:block; color:var(--muted); font-size:.88rem; margin:15px 0 6px; }
    .field { width:100%; border:1px solid var(--line); background:#0c1117; color:var(--text); border-radius:10px; padding:12px; outline:0; }
    .field:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(103,232,182,.1); }
    .login .primary { width:100%; margin-top:20px; }
    .message { min-height:24px; color:var(--danger); font-size:.88rem; margin:10px 0 0; }
    .message.ok { color:var(--accent); }
    .browse-tools { display:grid; grid-template-columns:minmax(220px,1fr) auto auto; gap:9px; margin:4px 0 24px; }
    .tool-input,.tool-select { min-width:0; border:1px solid var(--line); background:#0d131a; color:var(--text); border-radius:10px; padding:10px 12px; outline:0; }
    .tool-input:focus,.tool-select:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(103,232,182,.1); }
    .tool-input::placeholder { color:#697587; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    dialog { width:min(900px,calc(100% - 24px)); border:1px solid var(--line); border-radius:16px; padding:0; background:#050709; color:var(--text); box-shadow:0 30px 100px #000; }
    dialog::backdrop { background:rgba(0,0,0,.8); backdrop-filter:blur(5px); }
    .player-head { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:4px 12px; padding:12px 15px; }
    .player-state { grid-column:1; color:var(--muted); font-size:.78rem; min-height:1.2em; }
    #player { width:100%; max-height:76vh; display:block; background:#000; }
    @keyframes pulse { to { opacity:.45; transform:scale(.88); } }
    @media (max-width:640px) {
      .shell{width:calc(100% - 20px);padding:16px 0 44px}
      header{margin-bottom:24px}
      h1{font-size:2.35rem}
      .add-box{grid-template-columns:minmax(0,1fr);margin-bottom:28px}
      .add-box .primary{width:100%}
      .browse-tools{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
      .browse-tools .tool-input{grid-column:1/-1}
      .card{padding:14px;border-radius:14px}
      .card-top{display:block}
      .status{display:block;margin-top:8px}
      .media-gallery,.library-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
      .media-name{font-size:.76rem}
      .torrent-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
      .torrent-actions>:only-child{grid-column:1/-1}
      .control{min-width:0;padding:10px 8px;overflow:hidden;text-overflow:ellipsis}
      .login-card{padding:22px}
      .section-head>.muted{flex:0 0 auto}
    }
    @media (max-width:360px) { .media-gallery,.library-grid{grid-template-columns:minmax(0,1fr)} }
  </style>
</head>
<body>
  <section class="login" id="loginView">
    <form class="login-card" id="loginForm">
      <div class="brand"><span class="mark"></span> Magnet Box</div>
      <h2>Acceso privado</h2>
      <p class="muted">Ingresa tus credenciales para continuar.</p>
      <label for="username">Usuario</label>
      <input class="field" id="username" name="username" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <input class="field" id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">Entrar</button>
      <p class="message" id="loginMessage" role="alert"></p>
    </form>
  </section>

  <main class="app hidden" id="appView">
    <div class="shell">
      <header>
        <div class="brand"><span class="mark"></span> Magnet Box</div>
        <button class="ghost" id="logoutButton">Salir</button>
      </header>
      <h1>Un magnet.<br>Directo a tu pantalla.</h1>
      <p class="muted">Pega un magnet o una URL de búsqueda de Pirate Bay. Las importaciones omiten resultados sin seeders.</p>

      <form class="add-box" id="magnetForm">
        <input id="magnetInput" aria-label="Enlace magnet o búsqueda" placeholder="magnet:?… o URL de búsqueda" autocomplete="off" required>
        <button class="primary" type="submit">Agregar o importar</button>
      </form>
      <p class="message" id="addMessage" role="status"></p>

      <div class="browse-tools" role="search">
        <label class="sr-only" for="searchInput">Buscar torrents o videos</label>
        <input class="tool-input" id="searchInput" type="search" placeholder="Buscar descarga o video…" autocomplete="off">
        <label class="sr-only" for="statusFilter">Filtrar estado</label>
        <select class="tool-select" id="statusFilter">
          <option value="all">Todos los estados</option>
          <option value="active">Activos</option>
          <option value="complete">Completos</option>
          <option value="paused">Pausados</option>
          <option value="waiting">Esperando</option>
        </select>
        <label class="sr-only" for="sortMode">Ordenar resultados</label>
        <select class="tool-select" id="sortMode">
          <option value="recent">Más recientes</option>
          <option value="name">Nombre A–Z</option>
          <option value="size">Mayor tamaño</option>
          <option value="progress">Mayor progreso</option>
        </select>
      </div>

      <section>
        <div class="section-head"><h2>Descargas</h2><span class="muted" id="downloadCount">0 activas</span></div>
        <div class="downloads-grid" id="downloads"></div>
      </section>

      <section class="library">
        <div class="section-head"><h2>Favoritos</h2><span class="muted" id="favoriteCount">0 videos</span></div>
        <div class="library-grid" id="favorites"></div>
      </section>

      <section class="library">
        <div class="section-head"><h2>Videos en el servidor</h2><span class="muted" id="libraryCount">0 videos</span></div>
        <div class="library-grid" id="library"></div>
      </section>
    </div>
  </main>

  <dialog id="playerDialog">
    <div class="player-head"><strong id="playerTitle">Video</strong><button class="ghost" id="closePlayer">Cerrar</button><span class="player-state" id="playerState"></span></div>
    <video id="player" controls playsinline preload="metadata"></video>
  </dialog>

  <script>
    const $ = (selector) => document.querySelector(selector)
    const loginView = $('#loginView')
    const appView = $('#appView')
    const playerDialog = $('#playerDialog')
    const player = $('#player')
    const expandedGalleries = new Set()
    let lastTorrentItems = []
    let torrentStructureKey = ''
    let libraryStructureKey = ''
    let libraryLimit = 18
    let lastLibraryItems = []
    let suppressPreviewClickUntil = 0
    let pressedPreviewCard = null
    let activePreviewCard = null
    const thumbnailQueue = []
    let queuedThumbnails = new WeakSet()
    let thumbnailsLoading = 0
    let thumbnailGeneration = 0
    let thumbnailsPaused = false
    let refreshTimer
    let lastLibraryRefresh = 0
    let refreshInFlight = null
    let completedTorrentIds = new Set()

    const thumbnailObserver = 'IntersectionObserver' in window
      ? new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) return
            thumbnailObserver.unobserve(entry.target)
            queueThumbnail(entry.target)
          })
        }, { rootMargin:'160px' })
      : null

    async function api(url, options = {}) {
      const response = await fetch(url, { ...options, headers: { 'Content-Type': 'application/json', ...(options.headers || {}) } })
      const data = response.headers.get('content-type')?.includes('json') ? await response.json() : null
      if (response.status === 401 && url !== '/api/login') showLogin()
      if (!response.ok) throw new Error(data?.error || 'No se pudo completar la acción.')
      return data
    }

    function humanBytes(value = 0) {
      const units = ['B','KB','MB','GB','TB']
      let size = value, unit = 0
      while (size >= 1024 && unit < units.length - 1) { size /= 1024; unit += 1 }
      return `${size.toFixed(unit ? 1 : 0)} ${units[unit]}`
    }

    function escapeHtml(value = '') {
      return value.replace(/[&<>'"]/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[char]))
    }

    function normalized(value = '') {
      return String(value).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
    }

    function currentQuery() {
      return normalized($('#searchInput').value.trim())
    }

    function matchesSearch(item) {
      const query = currentQuery()
      if (!query) return true
      return normalized([item.name,item.path,...(item.files || []).map((file) => file.name)].filter(Boolean).join(' ')).includes(query)
    }

    function matchesStatus(item) {
      const filter = $('#statusFilter').value
      if (filter === 'all') return true
      if (filter === 'complete') return item.status === 'completo'
      if (filter === 'paused') return item.status === 'pausado'
      if (filter === 'waiting') return ['buscando','verificando','esperando'].includes(item.status)
      if (filter === 'active') return ['buscando','verificando','esperando','descargando'].includes(item.status)
      return true
    }

    function sortItems(items, library = false) {
      const mode = $('#sortMode').value
      return [...items].sort((left,right) => {
        if (mode === 'name') return left.name.localeCompare(right.name,undefined,{ sensitivity:'base' })
        if (mode === 'size') return (right.length || 0) - (left.length || 0)
        if (mode === 'progress') return (right.progress || 0) - (left.progress || 0)
        return library
          ? (right.modifiedAt || 0) - (left.modifiedAt || 0)
          : (right.createdAt || 0) - (left.createdAt || 0)
      })
    }

    function showLogin() {
      clearInterval(refreshTimer)
      appView.classList.add('hidden')
      loginView.classList.remove('hidden')
      stopPreview(activePreviewCard)
      player.pause()
      playerDialog.close?.()
    }

    function showApp() {
      loginView.classList.add('hidden')
      appView.classList.remove('hidden')
      refresh(true)
      clearInterval(refreshTimer)
      refreshTimer = setInterval(refresh, 2000)
    }

    function openPlayer(name, url) {
      stopPreview(activePreviewCard)
      pauseThumbnailWork()
      $('#playerTitle').textContent = name
      $('#playerState').textContent = 'Preparando video…'
      playerDialog.showModal()
      player.src = url
      player.load()
      player.play().catch(() => {})
    }

    function mediaCard(item, libraryItem = false) {
      const name = escapeHtml(item.name)
      const url = escapeHtml(item.streamUrl)
      const fileIndex = Number.isInteger(item.index) ? ` data-file-index="${item.index}"` : ''
      const complete = Boolean(item.complete)
      const progress = Math.max(0,Math.min(100,Math.round((item.progress || 0) * 100)))
      const fileProgress = complete ? '' : `<span class="media-file-progress" title="${progress}% descargado"><span style="width:${progress}%"></span></span>`
      const libraryPath = libraryItem ? escapeHtml(item.path) : ''
      const tools = libraryItem ? `<span class="media-tools"><button class="media-tool ${item.favorite ? 'favorite' : ''}" data-favorite-path="${libraryPath}" data-favorite="${!item.favorite}" title="${item.favorite ? 'Quitar de favoritos' : 'Agregar a favoritos'}">★</button><button class="media-tool delete" data-delete-path="${libraryPath}" title="Borrar video">🗑</button></span>` : ''
      return `<div class="media-card"${fileIndex} data-name="${name}" data-url="${url}" data-complete="${complete}" role="button" tabindex="0" aria-label="Reproducir ${name}"><video class="media-thumb" muted playsinline preload="none" data-src="${url}"></video><span class="media-play">▶</span>${tools}<span class="media-shade"><span class="media-name">${name}</span></span>${fileProgress}</div>`
    }

    function ensureVideoSource(video, preload = 'metadata') {
      if (video.getAttribute('src')) return
      video.preload = preload
      video.src = video.dataset.src
      video.load()
    }

    function queueThumbnail(card) {
      if (thumbnailsPaused || !card?.isConnected || card.dataset.complete !== 'true' || queuedThumbnails.has(card)) return
      queuedThumbnails.add(card)
      thumbnailQueue.push(card)
      pumpThumbnails()
    }

    function pumpThumbnails() {
      if (thumbnailsPaused) return
      while (thumbnailsLoading < 1 && thumbnailQueue.length) {
        const card = thumbnailQueue.shift()
        if (!card?.isConnected) continue
        thumbnailsLoading += 1
        loadThumbnail(card).finally(() => {
          thumbnailsLoading -= 1
          pumpThumbnails()
        })
      }
    }

    function loadThumbnail(card) {
      return new Promise((resolve) => {
        const video = card.querySelector('.media-thumb')
        if (!video || card.classList.contains('thumb-ready')) return resolve()
        const generation = thumbnailGeneration
        let finished = false
        const finish = (success) => {
          if (finished) return
          finished = true
          clearTimeout(timeout)
          video.removeEventListener('loadedmetadata', seek)
          video.removeEventListener('seeked', ready)
          video.removeEventListener('error', failed)
          card.classList.remove('loading')
          if (success) card.classList.add('thumb-ready')
          if (!success) {
            video.pause()
            video.removeAttribute('src')
            video.load()
          }
          resolve()
        }
        const ready = () => {
          if (generation !== thumbnailGeneration || thumbnailsPaused) return finish(false)
          let captured = false
          try {
            if (video.videoWidth && video.videoHeight) {
              const canvas = document.createElement('canvas')
              canvas.width = 360
              canvas.height = Math.max(1,Math.round(360 * video.videoHeight / video.videoWidth))
              canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height)
              video.poster = canvas.toDataURL('image/jpeg',.72)
              captured = true
            }
          } catch {}
          video.pause()
          video.removeAttribute('src')
          video.load()
          finish(captured)
        }
        const failed = () => finish(false)
        const seek = () => {
          if (generation !== thumbnailGeneration || thumbnailsPaused) return finish(false)
          // Un cuadro cercano al inicio necesita muchas menos lecturas que buscar
          // varios segundos dentro de archivos grandes o torrents recientes.
          const target = Number.isFinite(video.duration) && video.duration > .25 ? .15 : 0
          if (Math.abs(video.currentTime - target) < .05) return ready()
          try { video.currentTime = target } catch { failed() }
        }
        const timeout = setTimeout(() => finish(false),5000)
        card.classList.add('loading')
        video.addEventListener('loadedmetadata',seek,{ once:true })
        video.addEventListener('seeked',ready,{ once:true })
        video.addEventListener('error',failed,{ once:true })
        ensureVideoSource(video)
        if (video.readyState >= 1) seek()
      })
    }

    function pauseThumbnailWork() {
      thumbnailsPaused = true
      thumbnailGeneration += 1
      thumbnailQueue.length = 0
      queuedThumbnails = new WeakSet()
      document.querySelectorAll('.media-thumb').forEach((video) => {
        video.pause()
        video.removeAttribute('src')
        video.load()
        video.closest('.media-card')?.classList.remove('loading','previewing')
      })
      activePreviewCard = null
    }

    function resumeThumbnailWork() {
      thumbnailsPaused = false
      document.querySelectorAll('.media-card[data-complete="true"]:not(.thumb-ready)').forEach(queueThumbnail)
      pumpThumbnails()
    }

    function activateMediaCards(root) {
      root.querySelectorAll('.media-card[data-complete="true"]').forEach((card) => {
        if (thumbnailObserver) thumbnailObserver.observe(card)
      })
    }

    function disposeMedia(root) {
      root.querySelectorAll('.media-card').forEach((card) => {
        thumbnailObserver?.unobserve(card)
        clearTimeout(card.previewTimer)
        clearTimeout(card.releaseTimer)
        const video = card.querySelector('.media-thumb')
        if (!video) return
        video.pause()
        video.removeAttribute('src')
        video.load()
      })
      if (activePreviewCard && root.contains(activePreviewCard)) activePreviewCard = null
    }

    function startPreview(card) {
      if (!playerDialog.open) thumbnailsPaused = false
      const video = card?.querySelector('.media-thumb')
      if (!video || playerDialog.open) return
      if (activePreviewCard && activePreviewCard !== card) stopPreview(activePreviewCard)
      activePreviewCard = card
      card.previewWanted = true
      card.classList.add('previewing')
      card.classList.add('loading')
      video.muted = true
      ensureVideoSource(video,'auto')
      const play = () => {
        if (!card.previewWanted) return
        card.classList.remove('loading')
        video.play().catch(() => card.classList.remove('previewing'))
      }
      if (video.readyState >= 2) play()
      else video.addEventListener('canplay',play,{ once:true })
    }

    function stopPreview(card) {
      const video = card?.querySelector('.media-thumb')
      if (!video) return
      clearTimeout(card.previewTimer)
      clearTimeout(card.releaseTimer)
      card.previewWanted = false
      video.pause()
      card.classList.remove('previewing','loading')
      const release = () => {
        if (card.previewWanted) return
        video.removeAttribute('src')
        video.load()
      }
      if (card.dataset.complete === 'true') card.releaseTimer = setTimeout(release,10000)
      else release()
      if (activePreviewCard === card) activePreviewCard = null
    }

    function renderTorrents(items) {
      lastTorrentItems = items
      const nextCompletedIds = new Set(items.filter((item) => item.status === 'completo').map((item) => item.id))
      if ([...nextCompletedIds].some((id) => !completedTorrentIds.has(id))) lastLibraryRefresh = 0
      completedTorrentIds = nextCompletedIds
      const active = items.filter((item) => !['completo','sin-seeders','error'].includes(item.status)).length
      const displayItems = sortItems(items.filter((item) => matchesSearch(item) && matchesStatus(item)))
      $('#downloadCount').textContent = displayItems.length === items.length
        ? `${items.length} ${items.length === 1 ? 'descarga' : 'descargas'} · ${active} ${active === 1 ? 'activa' : 'activas'}`
        : `${displayItems.length} de ${items.length}`
      const nextStructureKey = JSON.stringify([currentQuery(),$('#statusFilter').value,$('#sortMode').value,displayItems.map((item) => [item.id,item.name,item.status,item.message,item.files.map((file) => [file.name,file.video]),expandedGalleries.has(item.id)])])
      if (nextStructureKey === torrentStructureKey) {
        displayItems.forEach((item) => {
          const card = document.getElementById(`torrent-${item.id}`)
          if (!card) return
          card.querySelector('.js-progress').style.width = `${Math.round(item.progress * 100)}%`
          card.querySelector('.js-stats').textContent = `${Math.round(item.progress * 100)}% · ${humanBytes(item.downloaded)} de ${humanBytes(item.length)} · ${humanBytes(item.speed)}/s`
          card.querySelector('.js-peers').textContent = `${item.peers} pares`
          item.files.forEach((file) => {
            const media = card.querySelector(`[data-file-index="${file.index}"]`)
            const progressBar = media?.querySelector('.media-file-progress>span')
            if (progressBar) progressBar.style.width = `${Math.round(file.progress * 100)}%`
            if (file.complete && media?.dataset.complete === 'false') {
              media.dataset.complete = 'true'
              media.querySelector('.media-file-progress')?.remove()
              if (thumbnailObserver) thumbnailObserver.observe(media)
            }
          })
        })
        return
      }
      torrentStructureKey = nextStructureKey
      const downloads = $('#downloads')
      disposeMedia(downloads)
      downloads.innerHTML = displayItems.length ? displayItems.map((item) => {
        const percent = Math.round(item.progress * 100)
        const bad = ['sin-seeders','error'].includes(item.status)
        const paused = item.status === 'pausado'
        const videoFiles = item.files.filter((file) => file.video)
        const expanded = expandedGalleries.has(item.id)
        const visibleFiles = expanded ? videoFiles : videoFiles.slice(0,6)
        const cards = visibleFiles.map(mediaCard).join('')
        const toggle = videoFiles.length > 6 ? `<button class="gallery-more" data-gallery-id="${item.id}">${expanded ? 'Mostrar menos' : `Ver los ${videoFiles.length} videos`}</button>` : ''
        const files = cards ? `<div class="media-gallery">${cards}${toggle}</div>` : ''
        const pauseButton = item.status === 'descargando' ? `<button class="control" data-action="pause" data-id="${item.id}">Ⅱ Pausar</button>` : ''
        const resumeButton = paused ? `<button class="control" data-action="resume" data-id="${item.id}">▶ Reanudar</button>` : ''
        const cancelButton = item.status !== 'completo' ? `<button class="control danger" data-action="cancel" data-id="${item.id}">Cancelar</button>` : ''
        const forgetButton = item.status === 'completo' ? `<button class="control" data-action="forget" data-id="${item.id}" title="Conserva los archivos descargados">Quitar de la lista</button>` : ''
        const actions = pauseButton || resumeButton || cancelButton || forgetButton ? `<div class="torrent-actions">${pauseButton}${resumeButton}${cancelButton}${forgetButton}</div>` : ''
        return `<article class="card torrent-card" id="torrent-${item.id}"><div class="card-top"><div><div class="title">${escapeHtml(item.name)}</div><div class="meta">${escapeHtml(item.message)} · <span class="js-peers">${item.peers} pares</span></div></div><span class="status ${bad ? 'bad' : ''} ${paused ? 'paused' : ''}">${escapeHtml(item.status)}</span></div><div class="progress"><div class="js-progress" style="width:${percent}%"></div></div><div class="meta js-stats">${percent}% · ${humanBytes(item.downloaded)} de ${humanBytes(item.length)} · ${humanBytes(item.speed)}/s</div>${files}${actions}</article>`
      }).join('') : `<div class="empty">${items.length ? 'No hay descargas que coincidan con la búsqueda o el filtro.' : 'Aún no hay descargas. Pega tu primer magnet arriba.'}</div>`
      activateMediaCards(downloads)
    }

    function renderLibrary(items) {
      lastLibraryItems = items
      const statusAllowsLibrary = ['all','complete'].includes($('#statusFilter').value)
      const displayItems = statusAllowsLibrary ? sortItems(items.filter(matchesSearch),true) : []
      $('#libraryCount').textContent = displayItems.length === items.length
        ? `${items.length} ${items.length === 1 ? 'video' : 'videos'}`
        : `${displayItems.length} de ${items.length}`
      const nextStructureKey = JSON.stringify([currentQuery(),$('#statusFilter').value,$('#sortMode').value,libraryLimit,displayItems.map((item) => [item.path,item.length,item.modifiedAt,item.favorite])])
      if (nextStructureKey === libraryStructureKey) return
      libraryStructureKey = nextStructureKey
      const library = $('#library')
      disposeMedia(library)
      if (!displayItems.length) {
        library.innerHTML = `<div class="empty">${items.length ? 'No hay videos que coincidan con la búsqueda o el filtro.' : 'Los videos descargados aparecerán aquí.'}</div>`
        renderFavorites(items)
        return
      }
      const visible = displayItems.slice(0,libraryLimit).map((item) => mediaCard(item,true)).join('')
      const more = displayItems.length > libraryLimit ? `<button class="gallery-more" data-library-more>Mostrar ${Math.min(18,displayItems.length-libraryLimit)} más</button>` : ''
      library.innerHTML = visible + more
      activateMediaCards(library)
      renderFavorites(items)
    }

    function renderFavorites(items) {
      const favorites = $('#favorites')
      disposeMedia(favorites)
      const visible = sortItems(items.filter((item) => item.favorite && matchesSearch(item)),true)
      $('#favoriteCount').textContent = `${visible.length} ${visible.length === 1 ? 'video' : 'videos'}`
      favorites.innerHTML = visible.length
        ? visible.map((item) => mediaCard(item,true)).join('')
        : '<div class="empty">Marca una estrella para guardar un video aquí.</div>'
      activateMediaCards(favorites)
    }

    function refresh(forceLibrary = false) {
      if (refreshInFlight) return refreshInFlight
      refreshInFlight = (async () => {
        try {
          const updateLibrary = forceLibrary || Date.now() - lastLibraryRefresh > 15000
          const [torrents, videos] = await Promise.all([
            api('/api/torrents'),
            updateLibrary ? api('/api/library') : Promise.resolve(null)
          ])
          renderTorrents(torrents)
          if (videos) {
            lastLibraryRefresh = Date.now()
            renderLibrary(videos)
          }
        } catch (error) {
          if (!appView.classList.contains('hidden')) $('#addMessage').textContent = error.message
        }
      })().finally(() => { refreshInFlight = null })
      return refreshInFlight
    }

    $('#loginForm').addEventListener('submit', async (event) => {
      event.preventDefault()
      $('#loginMessage').textContent = ''
      try {
        await api('/api/login', { method:'POST', body:JSON.stringify({ username:$('#username').value, password:$('#password').value }) })
        event.target.reset()
        showApp()
      } catch (error) { $('#loginMessage').textContent = error.message }
    })

    $('#magnetForm').addEventListener('submit', async (event) => {
      event.preventDefault()
      const button = event.target.querySelector('button')
      const value = $('#magnetInput').value.trim()
      const isMagnetLink = value.toLowerCase().startsWith('magnet:')
      button.disabled = true
      button.textContent = isMagnetLink ? 'Agregando…' : 'Importando…'
      $('#addMessage').textContent = ''
      $('#addMessage').classList.remove('ok')
      try {
        const result = await api(isMagnetLink ? '/api/torrents' : '/api/import-search', {
          method:'POST',
          body:JSON.stringify(isMagnetLink ? { magnet:value } : { url:value })
        })
        event.target.reset()
        $('#addMessage').textContent = result?.message || 'Agregado correctamente.'
        $('#addMessage').classList.add('ok')
        await refresh()
      } catch (error) {
        $('#addMessage').classList.remove('ok')
        $('#addMessage').textContent = error.message
      } finally {
        button.disabled = false
        button.textContent = 'Agregar o importar'
      }
    })

    document.addEventListener('click', async (event) => {
      const favoriteButton = event.target.closest('[data-favorite-path]')
      if (favoriteButton) {
        event.stopPropagation()
        favoriteButton.disabled = true
        try {
          await api('/api/library/favorite', { method:'PUT', body:JSON.stringify({ path:favoriteButton.dataset.favoritePath, favorite:favoriteButton.dataset.favorite === 'true' }) })
          lastLibraryRefresh = 0
          libraryStructureKey = ''
          await refresh(true)
        } catch (error) { $('#addMessage').textContent = error.message }
        return
      }

      const deleteButton = event.target.closest('[data-delete-path]')
      if (deleteButton) {
        event.stopPropagation()
        if (!confirm('¿Borrar este video definitivamente del servidor? Esta acción no se puede deshacer.')) return
        deleteButton.disabled = true
        try {
          await api('/api/library/video', { method:'DELETE', body:JSON.stringify({ path:deleteButton.dataset.deletePath }) })
          lastLibraryRefresh = 0
          libraryStructureKey = ''
          await refresh(true)
        } catch (error) { $('#addMessage').textContent = error.message }
        return
      }

      const galleryToggle = event.target.closest('[data-gallery-id]')
      if (galleryToggle) {
        const id = galleryToggle.dataset.galleryId
        if (expandedGalleries.has(id)) expandedGalleries.delete(id)
        else expandedGalleries.add(id)
        torrentStructureKey = ''
        renderTorrents(lastTorrentItems)
        return
      }

      if (event.target.closest('[data-library-more]')) {
        libraryLimit += 18
        libraryStructureKey = ''
        renderLibrary(lastLibraryItems)
        return
      }

      const button = event.target.closest('[data-url]')
      if (button) {
        if (Date.now() < suppressPreviewClickUntil) return
        return openPlayer(button.dataset.name, button.dataset.url)
      }

      const control = event.target.closest('[data-action]')
      if (!control) return
      const { action, id } = control.dataset
      if (action === 'cancel' && !confirm('¿Cancelar esta descarga y eliminar sus archivos parciales?')) return
      if (action === 'forget' && !confirm('¿Quitar esta descarga de la lista? Los archivos se conservarán en la biblioteca.')) return

      control.disabled = true
      $('#addMessage').textContent = ''
      try {
        playerDialog.close?.()
        const method = ['cancel','forget'].includes(action) ? 'DELETE' : 'POST'
        const suffix = action === 'cancel' ? '' : `/${action}`
        await api(`/api/torrents/${id}${suffix}`, { method })
        lastLibraryRefresh = 0
        await refresh(['cancel','forget'].includes(action))
      } catch (error) {
        $('#addMessage').textContent = error.message
        control.disabled = false
      }
    })
    document.addEventListener('keydown', (event) => {
      const card = event.target.closest('.media-card[data-url]')
      if (card && !event.target.closest('.media-tool') && (event.key === 'Enter' || event.key === ' ')) {
        event.preventDefault()
        openPlayer(card.dataset.name,card.dataset.url)
      }
    })
    document.addEventListener('pointerover', (event) => {
      const card = event.target.closest('.media-card')
      if (card && event.pointerType === 'mouse' && !card.contains(event.relatedTarget)) startPreview(card)
    })
    document.addEventListener('pointerout', (event) => {
      const card = event.target.closest('.media-card')
      if (card && event.pointerType === 'mouse' && !card.contains(event.relatedTarget)) stopPreview(card)
    })
    document.addEventListener('pointerdown', (event) => {
      const card = event.target.closest('.media-card')
      if (!card || event.pointerType === 'mouse') return
      pressedPreviewCard = card
      clearTimeout(card.previewTimer)
      card.previewTimer = setTimeout(() => {
        card.dataset.longPressed = 'true'
        startPreview(card)
      },450)
    })
    document.addEventListener('pointerup', (event) => {
      const card = event.target.closest('.media-card') || pressedPreviewCard
      if (!card) return
      clearTimeout(card.previewTimer)
      if (card.dataset.longPressed === 'true') {
        suppressPreviewClickUntil = Date.now() + 500
        delete card.dataset.longPressed
        stopPreview(card)
      }
      pressedPreviewCard = null
    })
    document.addEventListener('pointercancel', (event) => {
      const card = event.target.closest('.media-card') || pressedPreviewCard
      if (card) stopPreview(card)
      pressedPreviewCard = null
    })
    document.addEventListener('contextmenu', (event) => {
      if (event.target.closest('.media-card')) event.preventDefault()
    })
    $('#searchInput').addEventListener('input', () => {
      libraryLimit = 18
      torrentStructureKey = ''
      libraryStructureKey = ''
      renderTorrents(lastTorrentItems)
      renderLibrary(lastLibraryItems)
    })
    $('#statusFilter').addEventListener('change', () => {
      torrentStructureKey = ''
      libraryStructureKey = ''
      renderTorrents(lastTorrentItems)
      renderLibrary(lastLibraryItems)
    })
    $('#sortMode').addEventListener('change', () => {
      torrentStructureKey = ''
      libraryStructureKey = ''
      renderTorrents(lastTorrentItems)
      renderLibrary(lastLibraryItems)
    })
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stopPreview(activePreviewCard)
    })
    player.addEventListener('loadstart', () => { $('#playerState').textContent = 'Preparando video…' })
    player.addEventListener('waiting', () => { $('#playerState').textContent = 'Cargando las siguientes piezas…' })
    player.addEventListener('canplay', () => { $('#playerState').textContent = '' })
    player.addEventListener('playing', () => { $('#playerState').textContent = '' })
    player.addEventListener('error', () => { $('#playerState').textContent = 'Este formato o códec no puede reproducirse en este navegador.' })
    $('#closePlayer').addEventListener('click', () => playerDialog.close())
    playerDialog.addEventListener('close', () => {
      player.pause()
      player.removeAttribute('src')
      player.load()
      $('#playerState').textContent = ''
      resumeThumbnailWork()
    })
    $('#logoutButton').addEventListener('click', async () => { await api('/api/logout', { method:'POST' }).catch(() => {}); showLogin() })

    api('/api/session').then((session) => session.authenticated ? showApp() : showLogin()).catch(showLogin)
  </script>
</body>
</html>
